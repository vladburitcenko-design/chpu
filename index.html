<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТД НЭТ | Системы ЧПУ и Комплектующие</title>
    
    <link rel="preconnect" href="https://ajax.googleapis.com" crossorigin>
    
    <link rel="preload" href="model.glb" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="image_c63bc3.png" as="image">
    <link rel="preload" href="Benzin-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        /* Подключение вашего фирменного шрифта Benzin */
        @font-face {
            font-family: 'Benzin';
            src: url('Benzin-Bold.woff2') format('woff2'),
                 url('Benzin-Bold.woff') format('woff'),
                 url('Benzin-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap; 
        }

        @font-face {
            font-family: 'Benzin';
            src: url('Benzin-ExtraBold.woff2') format('woff2'),
                 url('Benzin-ExtraBold.woff') format('woff'),
                 url('Benzin-ExtraBold.ttf') format('truetype');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        /* Палитра */
        :root {
            --bg-card: #15171a;          
            --bg-card-hover: #0a0b0d;    
            --bg-placeholder: #22262a;   
            
            --bg-grad-main: linear-gradient(135deg, #2b3036 0%, #1e2126 100%); 
            --bg-grad-alt: linear-gradient(135deg, #32383e 0%, #262a30 100%); 
            
            --primary-orange: #ff6b00;   
            --dark-orange: #d95a00;      
            --text-light: #ffffff;       
            --text-muted: #adb5bd;       
            --text-body: #e9ecef;        
            
            --border-color: rgba(255, 255, 255, 0.06);     
            --border-highlight: rgba(255, 255, 255, 0.15);      
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            overflow-x: hidden; 
        }

        body {
            color: var(--text-light);
            background: var(--bg-grad-main);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1, h2, h3, h4 {
            font-family: 'Benzin', 'Segoe UI', sans-serif;
            font-weight: 800;
            color: var(--text-light);
        }

        h2 {
            font-size: 2.2rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-orange);
            color: #ffffff;
            padding: 14px 32px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.2);
            text-align: center;
        }

        .btn:hover {
            background-color: var(--dark-orange);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 0, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-light);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: none;
        }

        .btn-outline:hover {
            background: var(--primary-orange);
            border-color: var(--primary-orange);
            color: #ffffff;
        }

        /* Шапка */
        header {
            background-color: #1a1d21;
            color: var(--text-light);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--primary-orange);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            gap: 15px;
        }

        .logo {
            font-family: 'Benzin', 'Segoe UI', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-light);
            text-transform: uppercase;
            text-decoration: none;
            white-space: nowrap; 
        }

        .logo-img { height: 42px; width: auto; object-fit: contain; }
        .logo span { color: var(--primary-orange); }

        /* --- ГЛАВНЫЙ ЭКРАН --- */
        .hero-section {
            background: var(--bg-grad-alt);
            padding: 90px 0;
            border-bottom: 1px solid var(--border-color);
            overflow: hidden; 
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .hero-title-group {
            opacity: 0;
            transform: translate3d(-40px, -40px, 0);
            transition: transform 0.4s ease, opacity 0.4s ease; 
            will-change: transform, opacity;
        }

        .hero-section.visible .hero-title-group {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.5s ease-out; 
        }

        .hero-title-group h1 {
            font-size: 2.8rem;
            margin-bottom: 25px;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .hero-desc-group {
            opacity: 0;
            transform: translate3d(0, 50px, 0);
            transition: transform 0.4s ease, opacity 0.4s ease; 
            will-change: transform, opacity;
        }

        .hero-section.visible .hero-desc-group {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.6s, opacity 1.5s ease-out 0.6s;
        }

        .hero-desc-group p {
            color: var(--text-body);
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .stat-wrapper {
            display: flex;
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease; 
            will-change: transform, opacity;
        }

        .stat-wrapper:nth-child(1) { transform: translate3d(-30%, -30%, 0) scale(0.4); }
        .stat-wrapper:nth-child(2) { transform: translate3d(30%, -30%, 0) scale(0.4); }
        .stat-wrapper:nth-child(3) { transform: translate3d(-30%, 30%, 0) scale(0.4); }
        .stat-wrapper:nth-child(4) { transform: translate3d(30%, 30%, 0) scale(0.4); }

        .hero-section.visible .stat-wrapper {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
        }

        .hero-section.visible .stat-wrapper:nth-child(1) { transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.8s, opacity 1.2s ease-out 0.8s; }
        .hero-section.visible .stat-wrapper:nth-child(2) { transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.95s, opacity 1.2s ease-out 0.95s; }
        .hero-section.visible .stat-wrapper:nth-child(3) { transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.1s, opacity 1.2s ease-out 1.1s; }
        .hero-section.visible .stat-wrapper:nth-child(4) { transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.25s, opacity 1.2s ease-out 1.25s; }

        .stat-item {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px 20px;
            border-radius: 6px;
            text-align: center;
            border-bottom: 4px solid var(--primary-orange);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
        }
        
        .stat-item:hover {
            transform: translate3d(0, -5px, 0);
            background-color: var(--bg-card-hover);
            border-color: var(--border-highlight);
        }

        .stat-item h3 {
            font-family: 'Benzin', sans-serif;
            font-size: 2.5rem;
            color: var(--primary-orange);
            margin-bottom: 5px;
        }

        .stat-item p {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-body);
            margin: 0;
        }

        /* =========================================
           РАЗДЕЛ: ИНТЕРАКТИВНАЯ 3D МОДЕЛЬ (ДИНАМИЧЕСКИЙ ЛЕЙАУТ)
           ========================================= */
        .model-section {
            padding: 90px 0;
            background-color: #0a0b0d; 
            border-bottom: 1px solid var(--border-color);
            overflow: hidden; 
        }

        /* Обертка для заголовка, чтобы он плавно исчезал */
        .model-title-wrapper {
            transition: max-height 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease, margin 0.8s ease;
            max-height: 200px;
            opacity: 1;
            margin-bottom: 25px;
            overflow: hidden;
        }

        /* Скрываем заголовок при раскрытии */
        .model-section.expanded .model-title-wrapper {
            max-height: 0;
            opacity: 0;
            margin-bottom: 0;
            pointer-events: none;
        }

        .model-title {
            font-size: 3.5rem;
            line-height: 1.1;
            color: var(--text-light);
            margin: 0;
            
            transform: translate3d(0, 100px, 0); 
            opacity: 0;
            transition: transform 0.8s ease, opacity 0.8s ease; 
            will-change: transform, opacity; 
        }

        .model-section.visible .model-title {
            transform: translate3d(0, 0, 0);
            opacity: 1;
            transition: transform 2.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.5s ease-out;
        }

        .model-title span {
            color: var(--primary-orange);
        }

        /* FLEXBOX ДЛЯ ПЛАВНОГО СМЕЩЕНИЯ */
        .model-layout {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            width: 100%;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            min-height: 850px; 
        }

        /* Колонки */
        .left-col {
            width: 38%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .center-col {
            width: 62%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .right-col {
            width: 0%;
            opacity: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
        }

        /* СОСТОЯНИЕ: РАСШИРЕНО (EXPANDED) */
        .model-section.expanded .left-col { width: 30%; }
        .model-section.expanded .center-col { width: 40%; }
        .model-section.expanded .right-col { 
            width: 30%; 
            opacity: 1; 
            overflow: visible; 
        }

        /* Стили для пунктов меню */
        .feature-item-wrapper {
            width: 100%;
            max-width: 440px;
            transform: translate3d(-100px, 0, 0);
            opacity: 0;
            transition: transform 0.8s ease, opacity 0.8s ease;
            will-change: transform, opacity;
        }

        /* Анимация появления левой колонки при скролле */
        .model-section.visible .left-col .feature-item-wrapper:not(.hidden-initial) {
            transform: translate3d(0, 0, 0);
            opacity: 1;
            transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.8s ease-out;
        }
        
        .model-section.visible .left-col .feature-item-wrapper:nth-child(1) { transition-delay: 0s; }
        .model-section.visible .left-col .feature-item-wrapper:nth-child(2) { transition-delay: 0.2s; }
        .model-section.visible .left-col .feature-item-wrapper:nth-child(3) { transition-delay: 0.4s; }

        /* СКРЫТЫЕ ЭЛЕМЕНТЫ (Появляются при клике "Посмотреть еще") */
        .hidden-initial {
            max-height: 0;
            opacity: 0;
            margin: 0;
            overflow: hidden;
            transform: translate3d(-50px, 0, 0);
            transition: max-height 0.8s ease, opacity 0.6s ease, margin 0.8s ease, transform 0.8s ease;
        }

        /* Левая скрытая часть выезжает */
        .model-section.expanded .left-col .hidden-initial {
            max-height: 200px;
            opacity: 1;
            transform: translate3d(0, 0, 0);
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s, opacity 0.8s ease 0.1s, max-height 0.8s ease;
        }

        /* Правая колонка выезжает */
        .right-col .feature-item-wrapper {
            transform: translate3d(50px, 0, 0); /* Выезжает справа */
        }
        
        .model-section.expanded .right-col .feature-item-wrapper {
            transform: translate3d(0, 0, 0);
            opacity: 1;
        }

        /* Задержки для правой колонки */
        .model-section.expanded .right-col .feature-item-wrapper:nth-child(1) { transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s, opacity 0.8s ease 0.2s; }
        .model-section.expanded .right-col .feature-item-wrapper:nth-child(2) { transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s, opacity 0.8s ease 0.3s; }
        .model-section.expanded .right-col .feature-item-wrapper:nth-child(3) { transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s, opacity 0.8s ease 0.4s; }
        .model-section.expanded .right-col .feature-item-wrapper:nth-child(4) { transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s, opacity 0.8s ease 0.5s; }

        /* КНОПКА "ПОСМОТРЕТЬ ЕЩЕ" */
        .view-more-wrapper {
            width: 100%;
            max-width: 440px;
            transform: translate3d(-100px, 0, 0);
            opacity: 0;
            transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s, opacity 1.8s ease-out 0.6s, max-height 0.6s ease, margin 0.6s ease;
            max-height: 100px;
            overflow: hidden;
        }

        .model-section.visible .view-more-wrapper {
            transform: translate3d(0, 0, 0);
            opacity: 1;
        }

        .view-more-btn {
            background: transparent;
            border: 2px dashed rgba(255, 107, 0, 0.5);
            color: var(--primary-orange);
            padding: 14px 18px;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Benzin', sans-serif;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            width: 100%;
            display: block;
        }

        .view-more-btn:hover {
            background: rgba(255, 107, 0, 0.1);
            border-color: var(--primary-orange);
            color: #fff;
        }

        /* Скрываем кнопку при расширении */
        .model-section.expanded .view-more-wrapper {
            max-height: 0;
            opacity: 0;
            margin: 0;
            padding: 0;
            pointer-events: none;
        }

        /* Внешний вид пункта меню */
        .feature-tag {
            display: block;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-left: 4px solid var(--primary-orange);
            padding: 14px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* При сужении колонок делаем текст чуть меньше для аккуратности */
        .model-section.expanded .feature-tag {
            font-size: 0.85rem;
            padding: 12px 14px;
        }

        .feature-item-wrapper:hover:not(.active) .feature-tag {
            transform: translate3d(6px, 0, 0);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
        }

        .feature-item-wrapper.active .feature-tag {
            transform: translate3d(12px, 0, 0) scale(1.02); 
            background: rgba(255, 107, 0, 0.12); 
            border-color: rgba(255, 107, 0, 0.4);
            color: var(--text-light);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        /* Аккордеон характеристик */
        .model-specs {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-left: 16px;
            border-left: 2px dashed rgba(255, 107, 0, 0.3);
            margin-left: 12px;
            transition: max-height 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease-in-out, margin-top 0.6s ease-in-out;
        }

        .feature-item-wrapper.active .model-specs {
            max-height: 160px;
            opacity: 1;
            margin-top: 10px;
            margin-bottom: 6px;
        }

        .spec-item {
            font-size: 0.8rem;
            color: var(--text-body);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spec-item::before {
            content: '';
            width: 5px;
            height: 5px;
            background-color: var(--primary-orange);
            border-radius: 50%;
        }

        /* 3D БЛОК И ОПИСАНИЯ */
        .model-viewer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 130%; 
            margin-right: -30%; 
            margin-top: -30px; 
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        /* Центрирование 3D при расширении */
        .model-section.expanded .model-viewer-container {
            width: 100%;
            margin-right: 0;
        }

        .model-viewer-wrapper {
            position: relative;
            width: 100%; 
            height: 550px; /* Немного уменьшил, чтобы влезло больше контента без скролла */
            border: none; 
            background: transparent; 
            box-shadow: none; 
        }

        .model-section.expanded .model-viewer-wrapper {
            height: 450px; 
        }

        .cnc-description-wrapper {
            position: relative;
            min-height: 80px; 
            width: 90%; 
            margin-top: 20px;
            text-align: center;
        }

        .cnc-desc {
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 0.95rem;
            color: var(--text-body);
            line-height: 1.5;
            
            opacity: 0;
            transform: translate3d(0, 15px, 0);
            transition: opacity 0.8s ease-in-out, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .cnc-desc.active {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            pointer-events: auto;
        }
        
        .cnc-desc strong {
            color: var(--primary-orange);
        }

        /* Стрелочки переключения */
        .model-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }
        
        .model-arrow:hover {
            background: var(--primary-orange);
            border-color: var(--primary-orange);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
        }

        .left-arrow { left: 10px; }
        .right-arrow { right: 10px; }

        .model-box {
            width: 100%;
            height: 100%;
            transform: translate3d(80%, 0, 0); 
            opacity: 0;
            transition: transform 0.8s ease, opacity 0.8s ease;
            will-change: transform, opacity;
        }

        .model-section.visible .model-box {
            transform: translate3d(0, 0, 0);
            opacity: 1;
            transition: transform 4s cubic-bezier(0.16, 1, 0.3, 1), opacity 3s ease-in-out;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
            --poster-color: transparent;
            cursor: grab; 
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease-in-out;
            transform: translate3d(0, 0, 0);
            opacity: 1;
        }

        model-viewer:active {
            cursor: grabbing;
        }

        model-viewer.slide-down {
            transform: translate3d(0, 100%, 0);
            opacity: 0;
        }

        model-viewer.snap-top {
            transition: none !important; 
            transform: translate3d(0, -100%, 0);
            opacity: 0;
        }

        /* =========================================
           РАЗДЕЛЫ 3-6 С АНИМАЦИЕЙ
           ========================================= */
        .anim-element {
            opacity: 0;
            transform: translate3d(0, 40px, 0);
            transition: transform 0.4s ease, opacity 0.4s ease;
            will-change: transform, opacity;
        }

        /* Обслуживание и сервис */
        .service-section {
            padding: 90px 0;
            background: var(--bg-grad-alt);
            border-bottom: 1px solid var(--border-color);
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 50px;
        }

        .service-header p {
            max-width: 600px;
            color: var(--text-body);
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .service-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            transition: transform 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
        }
        
        .service-item:hover {
